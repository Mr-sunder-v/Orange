name: Orange

on:
  push:
    branches:
      - pom

  pull_request:
    branches:
      - pom

  workflow_dispatch:

jobs:
  selenium-test:

    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINIAPIKEY }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Run Selenium TestNG Tests
        run: |
          mvn clean test -Dheadless=true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports
          path: |
            target/surefire-reports/**
            test-output/**
            Screenshots/**